name: Release client libraries

# Implements the full release runbook.
#
# Normally runs when a release PR (release-pr.yml) merges: the push changes
# release-manifest.json, and the version, spec and notes are the ones the PR
# recorded. Every optional job runs, with the defaults below. Preflight checks
# that the push merged a release PR with an approval of the manifest it merged.
#
# To retry a release PR's release, dispatch with fromManifest (and force if tags
# were left behind): that releases the manifest's spec, version and notes.
#
# Dispatch with no inputs to release without a release PR. Afterwards, set
# release-manifest.json on main to the release (Preflight's summary prints it),
# or the release PR stops syncing.
# Everything the runbook asks a human to look up — whether gonfalon is healthy,
# whether prod is caught up, the bump type, the version, the changelog body — is
# derived in the preflight job, which aborts with a specific reason rather than
# releasing on a guess.
on:
  push:
    branches:
      - main
    paths:
      - release-manifest.json
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Override the derived version (bare semver, e.g. 24.0.0). Blank = derive.'
        required: false
        type: string
      bumpType:
        description: 'Override the bump inferred from the changelog headings.'
        required: false
        type: choice
        default: ''
        options: ['', 'major', 'minor', 'patch']
      dryRun:
        description: 'Rehearse: clone and commit, but push nothing and publish nothing.'
        required: false
        type: boolean
        default: false
      force:
        description: 'Delete tags left behind by a previous failed attempt instead of aborting.'
        required: false
        type: boolean
        default: false
      openDownstreamPr:
        description: 'Open the downstream PRs (gonfalon and terraform-provider-launchdarkly).'
        required: false
        type: boolean
        default: true
      mirrorPublic:
        description: 'Open or update a PR copying this repo onto the public launchdarkly/ld-openapi.'
        required: false
        type: boolean
        default: true
      skipCiGate:
        description: "Release even if gonfalon's main branch is red."
        required: false
        type: boolean
        default: false
      fromManifest:
        description: "Release what release-manifest.json on this branch records, as a merged release PR does. For a release PR merge whose release failed: combine with force to retry it."
        required: false
        type: boolean
        default: false
      skipSpecParity:
        description: "Release the spec production is serving even if gonfalon main is ahead. Check the gonfalon PR's changelog entries before merging it."
        required: false
        type: boolean
        default: false

# Two concurrent releases would race on client-repo tags.
concurrency:
  group: release-client-libraries
  cancel-in-progress: false

jobs:
  # Runs on every release, not just rehearsals. A bad registry credential would
  # otherwise surface only after `make push` had already tagged five client repos,
  # which is the case that forces the delete-the-tags-and-retry dance. A dry run
  # cannot cover this on its own: create-release is skipped, pr-downstream skips
  # PR creation, and the publish dry-run scripts never authenticate to a registry.
  # This file is mirrored to the public launchdarkly/ld-openapi, where Actions
  # runs too and none of the credentials exist. Every other job needs one of
  # these two, so guarding them keeps a mirror sync from starting a release.
  token-audit:
    name: Token audit
    if: ${{ github.repository == 'launchdarkly/ld-openapi-private' }}
    # A reusable workflow is capped by what its caller grants, so id-token has to
    # be granted here as well as inside token-audit.yml.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/token-audit.yml
    with:
      # Only demand the credentials this run will actually use, so a switched-off
      # job cannot block the release — and so the flow can be rehearsed before
      # those tokens have been created.
      requireDownstreamToken: ${{ github.event_name == 'push' || inputs.openDownstreamPr }}
    secrets: inherit

  preflight:
    name: Preflight
    if: ${{ github.repository == 'launchdarkly/ld-openapi-private' }}
    runs-on: ubuntu-latest
    # Required for the OIDC token the octosts-action step exchanges.
    # pull-requests: read is for checking the merged release PR's approval.
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.derive.outputs.version }}
      major: ${{ steps.derive.outputs.major }}
      bump: ${{ steps.derive.outputs.bump }}
      changelog: ${{ steps.derive.outputs.changelog }}
      previous_version: ${{ steps.derive.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v4
      # Reading gonfalon needs a credential the releaser token does not have.
      # Minted at runtime rather than stored: no long-lived secret, and the trust
      # policy in launchdarkly/.github-private is what grants it.
      - uses: launchdarkly/octosts-action@v1
        id: sts
        with:
          identity: ld-openapi-downstream
          scope: launchdarkly
      - name: Derive release inputs and check gates
        id: derive
        # Two tokens: the releaser token for the client repos (tag checks, and tag
        # deletes when force=true), and the federated token for reading gonfalon.
        # REPO_TOKEN (GITHUB_TOKEN) only reads this repo's pull requests.
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GONFALON_TOKEN: ${{ steps.sts.outputs.token }}
          VERSION_OVERRIDE: ${{ inputs.releaseVersion }}
          BUMP_OVERRIDE: ${{ inputs.bumpType }}
          FORCE: ${{ inputs.force }}
          SKIP_CI_GATE: ${{ inputs.skipCiGate }}
          SKIP_SPEC_PARITY: ${{ inputs.skipSpecParity }}
          RELEASE_MANIFEST: ${{ (github.event_name == 'push' || inputs.fromManifest) && 'release-manifest.json' || '' }}
          # On a push only: the merge has to be an approved release PR.
          RELEASE_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
          REPO_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dryRun }}
          SPEC_OUT: ${{ runner.temp }}/openapi.json
        run: ./scripts/release/preflight.sh
      - name: Upload the verified spec
        uses: actions/upload-artifact@v4
        with:
          name: release-spec
          path: ${{ runner.temp }}/openapi.json
          if-no-files-found: error

  release:
    name: Build and publish clients
    needs: [preflight, token-audit]
    runs-on: ubuntu-latest
    env:
      LD_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      DRY_RUN: ${{ inputs.dryRun }}
      # The scripts/release-dry-run/*.sh scripts copy the artifacts they would
      # have published into this directory, and fail without it.
      LD_RELEASE_ARTIFACTS_DIR: ${{ github.workspace }}/dry-run-artifacts
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      RUBYGEM_API_KEY: ${{ secrets.RUBYGEM_API_KEY }}
      CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # npm publishes through trusted publishing (OIDC), which needs npm 11.5.1+.
      # The apt npm is far older, so Node and npm come from setup-node instead.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --global npm@^11.5.1
          sudo apt -q install -y unzip jq python3 python3-pip ruby
          # Install Go
          curl -s https://dl.google.com/go/go1.15.5.linux-amd64.tar.gz | sudo tar -xz -C /usr/local
          # Install yarn
          npm install --global yarn
          # Install python deps
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1
          sudo update-alternatives --install /usr/bin/pip pip /usr/bin/pip3 1
          pip install bravado
          pip install twine
          pip install -U packaging
          # Set up ruby
          mkdir -p ~/.rubygems
      - uses: actions/setup-java@v1
        with:
          java-version: '11'
      - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets-v1.1.0
        name: Get secrets
        with:
          aws_assume_role: ${{ vars.AWS_ROLE_ARN }}
          s3_path_pairs: 'launchdarkly-releaser/java/code-signing-keyring.gpg = /home/runner/code-signing-keyring.gpg'
      - name: Prepare secrets
        run: |
          ./scripts/release/prepare.sh
      - name: Download the verified spec
        uses: actions/download-artifact@v4
        with:
          name: release-spec
          path: ${{ runner.temp }}/release-spec
      - name: Build clients
        run: |
          export PATH=/opt/gradle/bin:/usr/local/go/bin:$HOME/.rubygems/bin:$PATH
          export GEM_HOME=$HOME/.rubygems
          java -XX:+PrintFlagsFinal -version | grep ThreadStackSize
          # The spec preflight verified, not a fresh download from production.
          make SPEC_FILE="${RUNNER_TEMP}/release-spec/openapi.json"
          # Verify that the generated client code can be built
          make BUILD_TARGETS="go java python ruby typescript-axios" build_clients
        # This step will:
        # * Push built clients to their respective Github repos
        # * Tag those commits with the release version
        # * Publish each client to it's respective platform (e.g. Rubygems)
        # With DRY_RUN=true it clones and commits but pushes/publishes nothing.
      - name: Publish clients
        run: |
          export PATH=/opt/gradle/bin:/usr/local/go/bin:$HOME/.rubygems/bin:$PATH
          export GEM_HOME=$HOME/.rubygems
          mkdir -p "$LD_RELEASE_ARTIFACTS_DIR"
          ./scripts/release/publish.sh
      # Lets a rehearsal be inspected: these are the exact artifacts a real run
      # would have pushed to the registries.
      - name: Upload dry-run artifacts
        if: ${{ inputs.dryRun }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-artifacts
          path: ${{ github.workspace }}/dry-run-artifacts
          if-no-files-found: error

  verify-published:
    name: Verify published
    needs: [preflight, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poll registries and client repo tags
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: ./scripts/release/verify-published.sh "${{ needs.preflight.outputs.version }}"
      - name: Skipped
        if: ${{ inputs.dryRun }}
        run: echo "Dry run — nothing was published, so there is nothing to verify."

  create-release:
    name: Create GitHub release
    needs: [preflight, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        repo: ['api-client-go', 'api-client-java', 'api-client-python', 'api-client-ruby', 'api-client-typescript']
    steps:
      - uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5 # v1.14.0
        if: ${{ !inputs.dryRun }}
        with:
          repo: ${{ matrix.repo }}
          token: ${{ secrets.BOT_TOKEN }}
          tag: v${{ needs.preflight.outputs.version }}
          body: ${{ needs.preflight.outputs.changelog }}

  # A PR of its own, apart from the api-client-go bump: that one rewrites imports
  # across hundreds of files on a major and can sit in review for days, and the
  # changelog should not wait on it.
  downstream-gonfalon-changelog:
    name: Gonfalon PR (record the release in apidocs/CHANGELOG.md)
    needs: [preflight, verify-published]
    if: ${{ (github.event_name == 'push' || inputs.openDownstreamPr) && !inputs.dryRun }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Checked out at the workspace root; pr-downstream clones gonfalon into a
      # subdirectory, so the script stays reachable by absolute path.
      - uses: actions/checkout@v4
      - name: Write the release notes
        env:
          NOTES: ${{ needs.preflight.outputs.changelog }}
        run: printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
      - uses: launchdarkly/octosts-action@v1
        id: sts
        with:
          identity: ld-openapi-downstream
          scope: launchdarkly
      - uses: launchdarkly/pr-downstream@08b3feb5df321ebfed2d0855493e81edbb06a2cf # v1.4.0
        id: pr
        with:
          repository: launchdarkly/gonfalon
          token: ${{ steps.sts.outputs.token }}
          author: launchdarkly-octoauth[bot]<226478175+launchdarkly-octoauth[bot]@users.noreply.github.com>
          reviewers: ${{ github.actor }}
          title: '[bot] API ${{ needs.preflight.outputs.version }}: record the release in apidocs/CHANGELOG.md'
          branch: api-changelog/${{ needs.preflight.outputs.version }}
          commit-message: '[bot] Record API ${{ needs.preflight.outputs.version }} in apidocs/CHANGELOG.md'
          # Moves only the entries this release shipped. Entries merged after its
          # gonfalon commit stay under [Unreleased].
          update-command: python3 -I $GITHUB_WORKSPACE/scripts/release/gonfalon-changelog.py apidocs/CHANGELOG.md ${{ needs.preflight.outputs.version }} $(date -u +%Y-%m-%d) $RUNNER_TEMP/release-notes.md $RUNNER_TEMP/changelog-warnings.txt
          auto-merge: false
      # pr-downstream takes no PR body, so a mismatch goes in a comment: an entry
      # edited in gonfalon after the release shipped needs a human to reconcile.
      - name: Flag entries edited since the release
        if: ${{ steps.pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/changelog-warnings.txt" ] || exit 0
          {
            echo "These released entries were edited or moved in \`[Unreleased]\` after the release's gonfalon commit. The released text is recorded under the new version and the edited text stays under \`[Unreleased]\`; merge or drop the duplicates as needed:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/changelog-warnings.txt"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo launchdarkly/gonfalon --body-file "$RUNNER_TEMP/comment.md"

  # The bump itself runs in gonfalon's own update-api-client-go.yml, with
  # gonfalon's CI setup (private modules through the content cache, its Bazel
  # config). Run here, it kept failing on what that setup provides. This job
  # dispatches it and waits, so a failed bump still fails the release run.
  downstream-gonfalon:
    name: Gonfalon PR (api-client-go bump)
    needs: [preflight, verify-published]
    # Skipped on a rehearsal: the bump it opens is for a version that would not
    # exist yet.
    if: ${{ (github.event_name == 'push' || inputs.openDownstreamPr) && !inputs.dryRun }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # actions: write on gonfalon only (launchdarkly/.github-private:
      # ld-openapi-gonfalon-dispatch.sts.yaml), to dispatch and watch the run.
      - uses: launchdarkly/octosts-action@v1
        id: sts
        with:
          identity: ld-openapi-gonfalon-dispatch
          scope: launchdarkly
      - name: Dispatch gonfalon's update-api-client-go and wait for it
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          # A user, not a team; CODEOWNERS in gonfalon still pulls in the owners.
          REVIEWER: ${{ github.actor }}
        run: ./scripts/release/dispatch-gonfalon-bump.sh "$VERSION" "$REVIEWER"

  downstream-terraform-provider:
    name: Terraform provider PR (api-client-go bump)
    needs: [preflight, verify-published]
    if: ${{ (github.event_name == 'push' || inputs.openDownstreamPr) && !inputs.dryRun }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: launchdarkly/octosts-action@v1
        id: sts
        with:
          identity: ld-openapi-downstream
          scope: launchdarkly
      - uses: launchdarkly/pr-downstream@08b3feb5df321ebfed2d0855493e81edbb06a2cf # v1.4.0
        with:
          repository: launchdarkly/terraform-provider-launchdarkly
          token: ${{ steps.sts.outputs.token }}
          author: launchdarkly-octoauth[bot]<226478175+launchdarkly-octoauth[bot]@users.noreply.github.com>
          reviewers: ${{ github.actor }}
          title: 'chore(deps): bump api-client-go to v${{ needs.preflight.outputs.version }}'
          branch: bump-api-client-go/${{ needs.preflight.outputs.version }}
          # The provider uses release-please, which reads this prefix. `chore` keeps
          # the bump from cutting a provider release on its own; change to `feat`
          # if a client bump should ship one.
          commit-message: 'chore(deps): bump api-client-go to v${{ needs.preflight.outputs.version }}'
          # A major bump rewrites the import path across ~220 files here.
          auto-merge: false
          update-command: make update-api-client-go API_CLIENT_GO_VERSION=${{ needs.preflight.outputs.version }}

  # Its own workflow so a failed mirror can be retried without releasing again.
  mirror-public:
    name: Mirror to public ld-openapi
    needs: [preflight, verify-published]
    if: ${{ github.event_name == 'push' || inputs.mirrorPublic }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/mirror-public.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      dryRun: ${{ inputs.dryRun == true }}
